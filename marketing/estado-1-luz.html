<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estado 1 — Se fue la luz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D1B2E; font-family:'DM Sans',sans-serif; color:#fff; overflow:hidden; position:relative; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle,rgba(212,160,23,.14),transparent 70%); top:-250px; right:-250px; }
  .wrap { position:relative; height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 90px; }
  .badge { display:inline-flex; align-items:center; gap:14px; background:rgba(212,160,23,.12); border:2px solid rgba(212,160,23,.35); color:#EFC84A; font-weight:700; font-size:34px; padding:18px 36px; border-radius:999px; width:fit-content; margin-bottom:70px; }
  .dot { width:16px; height:16px; border-radius:50%; background:#EFC84A; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:94px; line-height:1.06; letter-spacing:-2px; margin-bottom:50px; }
  h1 .gold { color:#EFC84A; text-shadow:0 0 60px rgba(212,160,23,.5); }
  p.sub { font-size:44px; line-height:1.5; color:#8899AA; margin-bottom:90px; max-width:820px; }
  p.sub b { color:#fff; }
  .cta { background:linear-gradient(135deg,#D4A017,#EFC84A); color:#0D1B2E; font-weight:800; font-size:46px; padding:38px 70px; border-radius:28px; width:fit-content; box-shadow:0 10px 60px rgba(212,160,23,.35); margin-bottom:36px; }
  .link { font-size:38px; color:#8899AA; }
  .link b { color:#EFC84A; }
  .brand { position:absolute; bottom:80px; left:90px; display:flex; align-items:center; gap:20px; }
  .logo { width:64px; height:64px; background:linear-gradient(135deg,#D4A017,#EFC84A); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:36px; }
  .brand span { font-family:'Syne',sans-serif; font-weight:800; font-size:44px; }
  .rd { position:absolute; bottom:88px; right:90px; font-size:34px; color:#8899AA; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="badge"><span class="dot"></span> SIN INTERNET · SIN PROBLEMA</div>
    <h1>Se fue la luz…<br><span class="gold">y tú sigues<br>vendiendo.</span></h1>
    <p class="sub">VentaRD guarda todo en tu equipo. <b>Cobra, fía y cuadra caja sin internet.</b> Cuando vuelve la señal, se sincroniza solo.</p>
    <div class="cta">Prueba GRATIS →</div>
    <p class="link">Regístrate en <b>ventard.vercel.app</b></p>
  </div>
  <div class="brand"><div class="logo">🛒</div><span>VentaRD</span></div>
  <div class="rd">Hecho en RD</div>
</body>
</html>
