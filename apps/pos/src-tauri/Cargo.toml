[package]
name = "ventard-pos"
default-run = "ventard-pos"
version = "0.1.0"
edition.workspace = true
rust-version = "1.90"
license.workspace = true
publish.workspace = true

[lib]
name = "ventard_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
ventard-core = { path = "../../../crates/ventard-core", default-features = false, features = ["encrypted-storage"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
qa-spike = ["ventard-core/qa-spike"]
production-pilot = []
signed-updates = ["dep:tauri-plugin-updater", "dep:minisign-verify"]
release-tools = ["signed-updates"]

[[bin]]
name = "ventard-release-verify"
path = "src/release_verify.rs"
required-features = ["release-tools"]

[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.serde_json]
version = "1"

[target.'cfg(windows)'.dependencies]
uuid = { version = "1" }
keyring-core = { version = "=1.0.0", default-features = false }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
fs2 = "=0.4.3"
zeroize = "=1.9.1"
subtle = "=2.6.1"
reqwest = {version="=0.13.5",default-features=false,features= ["blocking", "json", "native-tls-no-alpn"] }
base64 = "=0.23.1"
rfd = {version="=0.17.2",default-features=false}
printers = { version = "=2.3.0", default-features = false }
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls", "zip"], optional = true }
minisign-verify = {version="=0.2.5", optional=true}

[dev-dependencies]
uuid = {version = "1", features = ["v4"] }
ed25519-dalek = {version="=2.2.0",default-features=false,features= ["std"] }
