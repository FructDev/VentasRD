[package]
name = "ventard-core"
version = "0.1.0"
description = "Núcleo de operaciones local-first del POS nativo Ventard"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
qa-spike = ["encrypted-storage"]
# Sólo fixtures sintéticos. El shell comercial debe usar encrypted-storage.
fixture-storage = ["dep:rusqlite", "rusqlite/bundled", "dep:fs2"]
encrypted-storage = ["dep:rusqlite", "rusqlite/bundled-sqlcipher-vendored-openssl", "rusqlite/backup", "dep:fs2", "dep:zeroize", "dep:getrandom", "dep:chacha20poly1305", "dep:subtle", "dep:ed25519-dalek", "dep:argon2", "dep:openssl"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.55", features = ["parsing"] }
base64 = "=0.22.1"
rusqlite = { version = "=0.40.2", optional = true, features = ["fallible_uint"] }
fs2 = { version = "=0.4.3", optional = true }
zeroize = { version = "=1.9.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }
chacha20poly1305 = { version = "=0.11.0", optional = true, default-features = false, features = ["alloc", "zeroize"] }
subtle = { version = "=2.6.1", optional = true }
ed25519-dalek = {version="=2.2.0",optional=true,default-features=false,features=["std","zeroize"]}
argon2 = {version="=0.5.3",optional=true,default-features=false,features=["alloc","zeroize"]}
openssl = {version="=0.10.76",optional=true}
